<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tischplan</title>
<style>
/* =========================================================
   Tischplan – Phase 1 (MVP + Hotel)
   Reine HTML/JS-App, Daten im Browser (localStorage)
   ========================================================= */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f9fafb; --line:#dde1e6; --text:#1d2329; --muted:#66707a;
  --accent:#1f6feb; --accent-t:#fff; --danger:#d1242f; --warn:#bf8700; --ok:#1a7f37;
  --st-frei:#e9edf1; --st-reserviert:#4f8ef7; --st-bald:#a371f7; --st-platziert:#2da44e;
  --st-rechnung:#f0883e; --st-ueberfaellig:#e5534b; --st-gesperrt:#8c959f; --st-ueberzogen:#cf222e;
  --hotel:#0e8a7d; --plan-bg:#fbfbfc; --plan-grid:#eef0f3; --decor:#c9ced4;
  --shadow:0 2px 10px rgba(0,0,0,.08); --r:10px;
}
:root[data-theme="dark"]{
  --bg:#0f1419; --panel:#171d24; --panel2:#1d242c; --line:#2c353f; --text:#e6edf3; --muted:#8b949e;
  --accent:#4c8dff; --st-frei:#2a323b; --plan-bg:#141a20; --plan-grid:#1c232b; --decor:#3a444f;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input,select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0}
label{font-size:13px;color:var(--muted);display:block}
label>input,label>select,label>textarea{margin-top:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.muted{color:var(--muted)}
.chk{display:flex;align-items:center;gap:6px;color:var(--text);font-size:14px}
.hidden{display:none!important}

/* ---------- Layout ---------- */
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header .brand{font-weight:700;font-size:17px;margin-right:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:9px 12px;border-radius:8px;color:var(--muted);min-height:40px}
nav button.active{background:var(--accent);color:#fff}
header .spacer{flex:1}
.ctx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctx input,.ctx select{width:auto;min-height:38px}
main{padding:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.panel .body{padding:12px 14px}

/* ---------- Live ---------- */
.live{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.roomtabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.plan-wrap{padding:8px;overflow:auto}
svg.plan{width:100%;height:auto;display:block;background:var(--plan-bg);border-radius:8px;touch-action:none;user-select:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.reslist{max-height:calc(100vh - 230px);overflow:auto}
.ritem{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;align-items:center}
.ritem:hover{background:var(--panel2)}
.ritem .time{font-weight:700;width:46px}
.ritem .main{flex:1;min-width:0}
.ritem .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .sub{font-size:12px;color:var(--muted)}
.ritem.unassigned{border-left:4px solid var(--danger)}
.ritem.cancel{opacity:.45}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.badge.st{color:#fff;border:0}
.badge.hotel{background:var(--hotel);color:#fff;border:0}
.badge.warn{background:var(--danger);color:#fff;border:0}
.kpis{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.kpi{flex:1;min-width:70px;background:var(--panel2);border-radius:8px;padding:6px 8px;text-align:center}
.kpi b{display:block;font-size:18px}
.kpi small{color:var(--muted);font-size:11px}

/* ---------- Gantt ---------- */
.gantt{overflow:auto;max-height:calc(100vh - 150px);position:relative}
.g-head,.g-row{display:flex;position:relative}
.g-head{position:sticky;top:0;z-index:3;background:var(--panel)}
.g-label{width:150px;min-width:150px;position:sticky;left:0;background:var(--panel);z-index:2;padding:0 10px;display:flex;align-items:center;border-right:1px solid var(--line);font-size:13px;gap:6px}
.g-row{height:38px;border-bottom:1px solid var(--line)}
.g-row.group .g-label{font-weight:700;background:var(--panel2)}
.g-row.group{height:28px;background:var(--panel2)}
.g-track{position:relative;flex:none}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding-left:3px}
.g-tick.half{border-left-style:dashed;opacity:.6}
.g-now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:1;pointer-events:none}
.g-bar{position:absolute;top:4px;height:29px;border-radius:6px;color:#fff;font-size:12px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:1}
.g-bar.conflict{outline:3px solid var(--danger);outline-offset:-1px}
.g-bar .rs{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize}
.g-head .g-track{height:28px}

/* ---------- Tabellen ---------- */
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th,table.list td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.list th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
table.list tr.clickable{cursor:pointer}
table.list tr.clickable:hover td{background:var(--panel2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.filters>*{width:auto}

/* ---------- Hotel ---------- */
.hotel{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.stay-chip{display:inline-flex;gap:6px;align-items:center;background:var(--hotel);color:#fff;border-radius:8px;padding:6px 10px;margin:3px;cursor:grab;touch-action:none;font-size:13px}
.stay-chip.ok{background:var(--panel2);color:var(--text);border:1px solid var(--line)}

/* ---------- Editor ---------- */
.editor{display:grid;grid-template-columns:200px 1fr 290px;gap:14px;align-items:start}
.toolbox .btn{width:100%;justify-content:flex-start;margin-bottom:6px}
.props label{margin-bottom:8px}

/* ---------- Modal/Popup/Toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal{background:var(--panel);border-radius:14px;max-width:720px;width:100%;max-height:calc(100vh - 28px);overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal .mh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.modal .mh h2{margin:0;font-size:18px;flex:1}
.modal .mb{padding:16px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);flex-wrap:wrap}
.warnbox{background:rgba(209,36,47,.1);border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.infobox{background:rgba(31,111,235,.08);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#24292f;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;box-shadow:var(--shadow);max-width:90vw}
.toast.err{background:var(--danger)}
.drag-ghost{position:fixed;z-index:300;pointer-events:none;background:var(--accent);color:#fff;padding:6px 10px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);transform:translate(-50%,-120%)}
.stbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stbtns .btn{justify-content:center;min-height:48px}

/* ---------- Login ---------- */
.login{max-width:380px;margin:10vh auto}
.userbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.userbtns .btn{min-height:64px;flex-direction:column;justify-content:center}

/* ---------- Berichte / Druck ---------- */
.report h2{margin:0 0 4px}
.report h4{margin:16px 0 6px}
.slotbar{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);margin:6px 0 2px}
.slotbar div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;position:relative;min-height:1px}
.slotbar div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.slotlbl{display:flex;gap:3px;font-size:10px;color:var(--muted)}
.slotlbl span{flex:1;text-align:center}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:0;color:#000;background:#fff}
  #printArea table.list th{position:static}
  #printArea svg.plan{background:#fff}
}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .live{grid-template-columns:1fr}
  .reslist{max-height:none}
  .editor{grid-template-columns:1fr}
  .hotel{grid-template-columns:1fr}
}
@media (max-width:640px){
  main{padding:8px}
  .grid2,.grid3{grid-template-columns:1fr}
  .stbtns{grid-template-columns:1fr 1fr}
  header .brand{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script>
'use strict';
/* =========================================================
   1) Konstanten, Übersetzungen, Hilfsfunktionen
   ========================================================= */
const STORE_KEY = 'tischplan.v1';
const LANG = 'de'; // vorbereitet für 'it' / 'en'
const I18N = {
  de: {
    live:'Live-Plan', zeit:'Zeitleiste', res:'Reservierungen', hotel:'Hotelgäste', berichte:'Berichte',
    editor:'Raumplan-Editor', settings:'Einstellungen',
    angefragt:'Angefragt', bestaetigt:'Bestätigt', eingetroffen:'Eingetroffen', platziert:'Platziert',
    rechnung:'Rechnung', abgeschlossen:'Abgeschlossen', storniert:'Storniert', noshow:'No-Show',
    frei:'Frei', reserviert:'Reserviert', bald:'Bald fällig', ueberfaellig:'Überfällig', gesperrt:'Gesperrt', ueberzogen:'Zeit überzogen',
    admin:'Admin / Betriebsleitung', empfang:'Empfang / Host', service:'Service', kueche:'Küche',
    UF:'Übernachtung/Frühstück', HP:'Halbpension', VP:'Vollpension', AI:'All-Inclusive',
    fenster:'Fensterplatz', rollstuhl:'Rollstuhlgerecht', hund:'Hundeplatz', kinder:'Kinderecke', ruhig:'Ruhig'
  }
};
const t = k => (I18N[LANG] && I18N[LANG][k]) || k;

const RES_STATUS = {
  angefragt:'#8c959f', bestaetigt:'#4f8ef7', eingetroffen:'#a371f7', platziert:'#2da44e',
  rechnung:'#f0883e', abgeschlossen:'#57606a', storniert:'#cf222e', noshow:'#7d2c2c'
};
const STATUS_ORDER = ['angefragt','bestaetigt','eingetroffen','platziert','rechnung','abgeschlossen'];
const TABLE_ST = ['frei','reserviert','bald','platziert','rechnung','ueberfaellig','ueberzogen','gesperrt'];
const TABLE_ST_ICON = {frei:'',reserviert:'◷',bald:'⏳',platziert:'●',rechnung:'€',ueberfaellig:'!',ueberzogen:'⌛',gesperrt:'✕'};
const PROPS = ['fenster','rollstuhl','hund','kinder','ruhig'];
const OCCASIONS = ['','Geburtstag','Jubiläum','Business','Hochzeitstag','Familienfeier','Sonstiges'];
const SOURCES = ['Telefon','Walk-in','Hotel','Hotel-Rezeption','Website','Google','E-Mail','Persönlich'];
const BOARDS = ['UF','HP','VP','AI'];
const BOARD_SERVICES = { UF:[], HP:['abend'], VP:['mittag','abend'], AI:['fruehstueck','mittag','abend'] };
const ROLE_VIEWS = {
  admin:['live','zeit','res','hotel','berichte','editor','settings'],
  empfang:['live','zeit','res','hotel','berichte'],
  service:['live','zeit','berichte'],
  kueche:['berichte']
};
const OPEN_STATES = ['angefragt','bestaetigt']; // noch nicht eingetroffen
const SEATED_STATES = ['eingetroffen','platziert','rechnung'];

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const toMin = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
const fromMin = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(((m % 60) + 60) % 60);
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const fmtDate = s => { const d = new Date(s + 'T12:00:00'); return WD[d.getDay()] + ', ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); };
const fmtShort = s => { const d = new Date(s + 'T12:00:00'); return WD[d.getDay()] + ' ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.'; };
const persons = r => (+r.adults || 0) + (+r.children || 0);
const resStart = r => toMin(r.time);
const resEnd = r => toMin(r.time) + (+r.duration || 0);
const overlaps = (a1, a2, b1, b2) => a1 < b2 && b1 < a2;
const snap = (v, g) => Math.round(v / g) * g;

function toast(msg, type) {
  $$('.toast').forEach(x => x.remove());
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 4500 : 2600);
}

/* =========================================================
   2) Datenhaltung (localStorage) + Audit-Log
   ========================================================= */
let DB = null;
const S = { // Sitzungszustand (nicht gespeichert)
  user: null, view: 'live', date: today(), serviceId: null, roomId: null,
  time: nowMin(), follow: true, edit: { roomId: null, sel: null }, resFilter: {}, hotelDate: today()
};

function load() {
  try { DB = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { DB = null; }
  if (!DB || !DB.version) { DB = demoData(); save(true); }
}
function save(silent) {
  DB.rev = (DB.rev || 0) + 1;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch (e) { toast('Speichern fehlgeschlagen: ' + e.message, 'err'); }
}
function log(action, detail) {
  DB.audit.unshift({ ts: Date.now(), user: S.user ? S.user.name : '-', action, detail: detail || '' });
  if (DB.audit.length > 1500) DB.audit.length = 1500;
}
// Synchronisation zwischen Browser-Tabs am selben Gerät
window.addEventListener('storage', e => { if (e.key === STORE_KEY && e.newValue) { DB = JSON.parse(e.newValue); render(); } });

/* =========================================================
   3) Fachlogik: Services, Verweildauer, Konflikte, Vorschläge
   ========================================================= */
const svcById = id => DB.services.find(s => s.id === id);
const tblById = id => DB.tables.find(x => x.id === id);
const roomById = id => DB.rooms.find(x => x.id === id);
const stayById = id => DB.stays.find(x => x.id === id);
const tblNames = ids => (ids || []).map(id => (tblById(id) || {}).name || '?').join('+');

function turnTime(serviceId, p) {
  const s = svcById(serviceId); if (!s) return 120;
  const row = [...s.turn].sort((a, b) => a.maxP - b.maxP).find(x => p <= x.maxP);
  return row ? row.min : s.turn[s.turn.length - 1].min;
}
function serviceForTime(min) {
  const list = DB.services.filter(s => min >= toMin(s.start) - 60 && min <= toMin(s.end));
  if (list.length) return list[list.length - 1].id;
  const later = DB.services.find(s => toMin(s.start) > min);
  return (later || DB.services[DB.services.length - 1]).id;
}
function isBlocked(tb, date, serviceId) {
  return (tb.blocks || []).some(b => b.date === date && (!b.serviceId || b.serviceId === serviceId));
}
// Reservierungen, die einen Tisch belegen (für Konflikte)
const occupies = r => r.status !== 'storniert' && r.status !== 'noshow' && r.status !== 'abgeschlossen';

function tableBusy(tid, date, start, end, exceptId) {
  return DB.reservations.filter(o => o.id !== exceptId && o.date === date && occupies(o) &&
    (o.tableIds || []).includes(tid) && overlaps(start, end, resStart(o), resEnd(o)));
}
function capOf(ids) {
  const tb = ids.map(tblById).filter(Boolean);
  return { max: tb.reduce((a, x) => a + (+x.max), 0), min: tb.reduce((a, x) => a + (+x.min), 0) };
}

/** Liefert eine Liste von Warnungen für eine (geplante) Reservierung */
function conflicts(r) {
  const out = [];
  if (!occupies(r)) return out;
  const st = resStart(r), en = resEnd(r), p = persons(r), s = svcById(r.serviceId);
  for (const tid of r.tableIds || []) {
    const tb = tblById(tid);
    if (!tb) { out.push('Tisch existiert nicht mehr'); continue; }
    if (isBlocked(tb, r.date, r.serviceId)) out.push(`Tisch ${tb.name} ist gesperrt`);
    for (const o of tableBusy(tid, r.date, st, en, r.id))
      out.push(`Überschneidung an Tisch ${tb.name} mit ${o.name} (${o.time}–${fromMin(resEnd(o))})`);
  }
  if ((r.tableIds || []).length) {
    const c = capOf(r.tableIds);
    if (p > c.max) out.push(`Tisch zu klein: ${p} Pers., max. ${c.max}`);
    else if (p < c.min) out.push(`Tisch zu groß: ${p} Pers., min. ${c.min}`);
  }
  if (s && s.pacing > 0) {
    const slot = Math.floor(st / 15) * 15;
    const covers = DB.reservations.filter(o => o.id !== r.id && o.date === r.date && o.serviceId === r.serviceId &&
      o.status !== 'storniert' && o.status !== 'noshow' && Math.floor(resStart(o) / 15) * 15 === slot)
      .reduce((a, o) => a + persons(o), 0) + p;
    if (covers > s.pacing) out.push(`Pacing: ${covers} Gäste im Slot ${fromMin(slot)} (Limit ${s.pacing})`);
  }
  if (s && (st < toMin(s.start) || st > toMin(s.end))) out.push(`Uhrzeit außerhalb Service ${s.name} (${s.start}–${s.end})`);
  // Doppelbuchung desselben Gastes (gleicher Hotelaufenthalt oder Telefon) – auch über Räume/Outlets hinweg
  const dup = DB.reservations.find(o => o.id !== r.id && o.date === r.date && occupies(o) &&
    overlaps(st, en, resStart(o), resEnd(o)) &&
    ((r.stayId && o.stayId === r.stayId) || (r.phone && o.phone && o.phone.replace(/\D/g, '') === r.phone.replace(/\D/g, ''))));
  if (dup) out.push(`Mögliche Doppelbuchung: ${dup.name} ist bereits um ${dup.time} reserviert`);
  return [...new Set(out)];
}

/** Tischvorschläge (einzelne Tische und Kombinationen), sortiert nach bester Passung */
function suggestTables(r, limit = 6) {
  const st = resStart(r), en = resEnd(r), p = persons(r);
  const wish = r.wishes || [];
  const free = tid => { const tb = tblById(tid); return tb && !isBlocked(tb, r.date, r.serviceId) && !tableBusy(tid, r.date, st, en, r.id).length; };
  const prefRoom = r.roomPref || S.roomId;
  const out = [];
  for (const tb of DB.tables) {
    if (p > +tb.max || !free(tb.id)) continue;
    // Tische unter Mindestbelegung nur als Ausweichvorschlag (hohe Strafpunkte)
    let score = (tb.max - p) * 10 + (tb.roomId !== prefRoom ? 4 : 0) + (p < +tb.min ? 40 + (tb.min - p) * 20 : 0);
    score -= wish.filter(w => (tb.props || []).includes(w)).length * 8;
    out.push({ ids: [tb.id], score });
  }
  for (const c of DB.combos) {
    if (!c.tableIds.every(free)) continue;
    const cap = capOf(c.tableIds);
    if (p > cap.max || p <= Math.max(...c.tableIds.map(id => +tblById(id).max))) continue;
    out.push({ ids: [...c.tableIds], score: (cap.max - p) * 10 + 15 });
  }
  return out.sort((a, b) => a.score - b.score).slice(0, limit);
}

/** Status eines Tisches zu einem Zeitpunkt (Live-Plan) */
function tableStatusAt(tb, date, serviceId, tm) {
  if (isBlocked(tb, date, serviceId)) return { st: 'gesperrt' };
  const rs = DB.reservations.filter(r => r.date === date && (r.tableIds || []).includes(tb.id) && occupies(r))
    .sort((a, b) => resStart(a) - resStart(b));
  const seated = rs.find(r => SEATED_STATES.includes(r.status));
  if (seated) return { st: seated.status === 'rechnung' ? 'rechnung' : (tm > resEnd(seated) ? 'ueberzogen' : 'platziert'), r: seated };
  const cur = rs.find(r => resStart(r) <= tm && tm < resEnd(r));
  if (cur) return { st: tm > resStart(cur) + 15 ? 'ueberfaellig' : 'reserviert', r: cur };
  const next = rs.find(r => resStart(r) > tm);
  if (next && resStart(next) - tm <= 60) return { st: 'bald', r: next };
  return { st: 'frei', next };
}

/* =========================================================
   4) Hotel: Aufenthalte → Reservierungen je Tag/Service
   ========================================================= */
function stayNights(stay) {
  const out = []; for (let d = stay.arrival; d < stay.departure; d = addDays(d, 1)) out.push(d); return out;
}
function stayServices(stay) {
  return DB.services.filter(s => BOARD_SERVICES[stay.board].includes(s.type) && !s.freeSeating);
}
function isInHouse(stay, date) { return stay.arrival <= date && date < stay.departure; }

/** Legt fehlende Reservierungen eines Aufenthalts an, aktualisiert bestehende, entfernt überflüssige */
function syncStay(stay) {
  const need = [];
  for (const d of stayNights(stay)) for (const s of stayServices(stay)) need.push({ date: d, serviceId: s.id, svc: s });
  const existing = DB.reservations.filter(r => r.stayId === stay.id);
  for (const ex of existing) {
    if (!need.some(n => n.date === ex.date && n.serviceId === ex.serviceId) && OPEN_STATES.includes(ex.status))
      DB.reservations.splice(DB.reservations.indexOf(ex), 1);
  }
  for (const n of need) {
    let r = existing.find(x => x.date === n.date && x.serviceId === n.serviceId && DB.reservations.includes(x));
    const p = (+stay.adults || 0) + (+stay.children || 0);
    if (!r) {
      r = { id: uid(), date: n.date, serviceId: n.serviceId, time: (stay.times && stay.times[n.svc.type]) || n.svc.hotelTime || n.svc.start,
        duration: turnTime(n.serviceId, p), status: 'bestaetigt', source: 'Hotel', stayId: stay.id, tableIds: [], createdAt: Date.now() };
      DB.reservations.push(r);
    }
    Object.assign(r, { name: `${stay.name} · Zi. ${stay.room}`, adults: stay.adults, children: stay.children,
      allergies: stay.allergies || '', notes: stay.notes || '', vip: !!stay.vip, phone: stay.phone || '' });
    if (OPEN_STATES.includes(r.status) && !r.manualTable) r.tableIds = [...(stay.tableIds || [])];
  }
}
/** Prüft, an welchen Tagen der feste Tisch eines Aufenthalts kollidiert */
function stayTableConflicts(stay, tableIds) {
  const days = [];
  for (const d of stayNights(stay)) for (const s of stayServices(stay)) {
    const own = DB.reservations.find(r => r.stayId === stay.id && r.date === d && r.serviceId === s.id);
    const st = own ? resStart(own) : toMin(s.hotelTime || s.start);
    const en = own ? resEnd(own) : st + turnTime(s.id, +stay.adults + +stay.children);
    for (const tid of tableIds) {
      const busy = tableBusy(tid, d, st, en, own && own.id).filter(o => o.stayId !== stay.id);
      if (busy.length) days.push(`${fmtShort(d)} ${s.name}: ${tblById(tid).name} belegt (${busy[0].name})`);
    }
  }
  return days;
}

let DRAGGING = false;
function openModal(title, body, buttons = [], onMount) {

  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="mh"><h2>${esc(title)}</h2>

  document.body.appendChild(bg);
  bg.addEventListener('pointerdown', e => { if (e.target === bg) bg.dataset.down = '1'; });
  bg.addEventListener('click', e => { if (e.target === bg && bg.dataset.down) closeModal(); delete bg.dataset.down; });
  $('[data-x]', bg).onclick = closeModal;
  $$('[data-b]', bg).forEach(el => el.onclick = () => { const b = buttons[+el.dataset.b]; if (b.action && b.action(bg) === false) return; if (!b.keep) closeModal(); });
  if (onMount) onMount(bg);

}
function closeModal() { const m = $('#modalBg'); if (m) m.remove(); }

/** Startet ein Ziehen per Pointer (funktioniert mit Maus und Touch). Ohne Bewegung = Klick */
function startDrag(e, { label, onDrop, onClick, onMove }) {
  if (e.button > 0) return;
  const sx = e.clientX, sy = e.clientY; let ghost = null, moved = false;
  const mv = ev => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 7) return;
    moved = true; DRAGGING = true;
    if (!ghost) { ghost = document.createElement('div'); ghost.className = 'drag-ghost'; ghost.textContent = label; document.body.appendChild(ghost); }
    ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
    if (onMove) onMove(ev);
  };
  const up = ev => {
    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    if (ghost) ghost.remove();
    setTimeout(() => DRAGGING = false, 0);
    if (moved) { const el = document.elementFromPoint(ev.clientX, ev.clientY); onDrop && onDrop(el, ev); }
    else if (ev.type === 'pointerup') onClick && onClick();
  };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
}

  } else {

/**

function planSVG(room, opts = {}) {
  const tables = DB.tables.filter(x => x.roomId === room.id);
  const decor = DB.decor.filter(x => x.roomId === room.id);
  const parts = [];
  parts.push(`<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--plan-grid)" stroke-width="1"/></pattern></defs>`);
  parts.push(`<rect width="${room.w}" height="${room.h}" fill="url(#grid)"/>`);
  if (room.bg) parts.push(`<image href="${room.bg}" x="0" y="0" width="${room.w}" height="${room.h}" preserveAspectRatio="xMidYMid meet" opacity="${opts.mode === 'edit' ? .55 : .35}"/>`);
  for (const d of decor) parts.push(decorSVG(d, opts.mode === 'edit' && opts.sel === d.id));
  // Verbindungslinien für kombinierte Tische einer Reservierung
  if (opts.status) {
    const seen = new Set();
    for (const tb of tables) {
      const s = opts.status(tb); if (!s.r || seen.has(s.r.id) || (s.r.tableIds || []).length < 2) continue; seen.add(s.r.id);
      const pts = s.r.tableIds.map(tblById).filter(x => x && x.roomId === room.id);
      for (let i = 1; i < pts.length; i++) parts.push(`<line x1="${pts[i - 1].x}" y1="${pts[i - 1].y}" x2="${pts[i].x}" y2="${pts[i].y}" stroke="var(--text)" stroke-width="3" stroke-dasharray="6 5" opacity=".5"/>`);
    }
  }
  for (const tb of tables) {
    const s = opts.status ? opts.status(tb) : { st: 'frei' };
    const fill = `var(--st-${s.st})`, light = s.st === 'frei';
    const station = DB.stations.find(x => x.id === tb.station);
    const sel = opts.sel === tb.id, hl = opts.highlight && opts.highlight.has(tb.id);
    const w = +tb.w, h = +tb.h;
    const shape = tb.shape === 'round' ? `<ellipse rx="${w / 2}" ry="${h / 2}" fill="${fill}" class="tbody"/>`
      : `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="7" fill="${fill}" class="tbody"/>`;
    const outline = (opts.showStations && station) ? (tb.shape === 'round' ? `<ellipse rx="${w / 2 + 3}" ry="${h / 2 + 3}" fill="none" stroke="${station.color}" stroke-width="4"/>`
      : `<rect x="${-w / 2 - 3}" y="${-h / 2 - 3}" width="${w + 6}" height="${h + 6}" rx="9" fill="none" stroke="${station.color}" stroke-width="4"/>`) : '';
    const selR = (sel || hl) ? `<rect x="${-w / 2 - 16}" y="${-h / 2 - 16}" width="${w + 32}" height="${h + 32}" rx="12" fill="none" stroke="${hl ? 'var(--hotel)' : 'var(--accent)'}" stroke-width="3" stroke-dasharray="6 4"/>` : '';
    const col = light ? 'var(--text)' : '#fff';
    const lines = [`<tspan x="0" font-weight="700" font-size="14">${esc(tb.name)} ${TABLE_ST_ICON[s.st] || ''}</tspan>`];
    if (opts.mode !== 'edit') {
      const r = s.r || s.next;
      const small = Math.min(w, h) < 66, maxLen = small ? 7 : 12;
      if (r && (s.r || opts.mode === 'assign')) {
        const nm = r.name.split(' · ')[0];
        lines.push(`<tspan x="0" dy="14" font-size="11">${esc(nm.length > maxLen ? nm.slice(0, maxLen - 1) + '…' : nm)}</tspan>`);
        if (small) lines.push(`<tspan x="0" dy="13" font-size="10">${persons(r)}P${r.stayId ? '⌂' : ''}${r.allergies ? '⚠' : ''}</tspan>`); else lines.push(`<tspan x="0" dy="13" font-size="11">${r.time} · ${persons(r)}P${r.stayId ? ' ⌂' : ''}${r.allergies ? ' ⚠' : ''}${r.vip ? ' ★' : ''}</tspan>`);
      } else if (s.next) {
        lines.push(`<tspan x="0" dy="14" font-size="11" opacity=".8">ab ${s.next.time}</tspan>`);
      } else lines.push(`<tspan x="0" dy="14" font-size="11" opacity=".7">${tb.min}–${tb.max} P</tspan>`);
    } else lines.push(`<tspan x="0" dy="14" font-size="11" opacity=".7">${tb.min}–${tb.max} P</tspan>`);
    const dy = -((lines.length - 1) * 13) / 2 + 4;
    parts.push(`<g class="tb" data-table-id="${tb.id}" transform="translate(${tb.x} ${tb.y}) rotate(${tb.rot || 0})" style="cursor:pointer">
      ${selR}<g class="chairs">${chairsSVG(tb)}</g>${outline}${shape}
      <text text-anchor="middle" y="${dy}" fill="${col}" transform="rotate(${-(tb.rot || 0)})" pointer-events="none">${lines.join('')}</text>
      ${opts.mode === 'edit' && sel ? `<rect class="rs-handle" x="${w / 2 - 6}" y="${h / 2 - 6}" width="14" height="14" fill="var(--accent)" style="cursor:nwse-resize"/>` : ''}</g>`);
  }
  return `<svg class="plan" viewBox="0 0 ${room.w} ${room.h}" data-room="${room.id}"><style>.chair{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}.benchseat{fill:var(--decor)}.tbody{stroke:rgba(0,0,0,.25);stroke-width:1.5}</style>${parts.join('')}</svg>`;
}
const legendHTML = () => `<div class="legend">${TABLE_ST.map(s => `<span><i style="background:var(--st-${s})"></i>${TABLE_ST_ICON[s] || ''} ${t(s)}</span>`).join('')}
  <span>⌂ Hotelgast</span><span>⚠ Allergie</span><span>★ VIP</span></div>`;

/* =========================================================
   8) App-Rahmen: Login, Kopfzeile, Navigation
   ========================================================= */
function renderLogin() {
  $('#app').innerHTML = `<div class="login panel"><h3>${esc(DB.betrieb)} – Anmeldung</h3><div class="body">
    <p class="muted">Benutzer wählen und PIN eingeben.</p>
    <div class="userbtns">${DB.users.map(u => `<button class="btn" data-u="${u.id}"><b>${esc(u.name)}</b><small class="muted">${t(u.role)}</small></button>`).join('')}</div>
    <p class="muted" style="font-size:12px;margin-top:14px">Demo-PINs: Admin 0000 · Empfang 1111 · Service 2222 · Küche 3333</p></div></div>`;
  $$('[data-u]').forEach(b => b.onclick = () => {
    const u = DB.users.find(x => x.id === b.dataset.u);
    openModal('PIN für ' + u.name, `<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="font-size:22px;text-align:center">`,
      [{ label: 'Anmelden', cls: 'primary', keep: true, action: () => tryLogin(u) }],
      bg => { const i = $('#pin', bg); i.focus(); i.onkeydown = e => { if (e.key === 'Enter') tryLogin(u); }; });
  });
}
function tryLogin(u) {
  if ($('#pin').value !== u.pin) { toast('PIN falsch', 'err'); return; }
  closeModal(); S.user = u; S.view = ROLE_VIEWS[u.role][0];
  try { sessionStorage.setItem('tischplan.user', u.id); } catch (e) {}
  log('Anmeldung', u.name); save(); render();
}
function logout() { S.user = null; try { sessionStorage.removeItem('tischplan.user'); } catch (e) {} render(); }

function headerHTML() {
  const views = ROLE_VIEWS[S.user.role];
  const showCtx = ['live', 'zeit', 'res', 'berichte'].includes(S.view);
  return `<header><span class="brand">🍽 ${esc(DB.betrieb)}</span>
    <nav>${views.map(v => `<button data-view="${v}" class="${S.view === v ? 'active' : ''}">${t(v)}</button>`).join('')}</nav>
    <span class="spacer"></span>
    ${showCtx ? `<div class="ctx"><button class="btn small" data-day="-1" aria-label="Vortag">◀</button>
      <input type="date" id="ctxDate" value="${S.date}"><button class="btn small" data-day="1" aria-label="Folgetag">▶</button>
      <button class="btn small" data-day="0">Heute</button>
      <select id="ctxSvc">${DB.services.map(s => `<option value="${s.id}" ${s.id === S.serviceId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>` : ''}
    <button class="btn small" id="themeBtn" title="Hell/Dunkel">${DB.theme === 'dark' ? '☀' : '☾'}</button>
    <button class="btn small" id="logoutBtn" title="Abmelden">${esc(S.user.name)} ⎋</button></header>`;
}
function bindHeader() {
  $$('[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; render(); });
  $$('[data-day]').forEach(b => b.onclick = () => {
    const d = +b.dataset.day; S.date = d ? addDays(S.date, d) : today();
    S.follow = S.date === today() && d === 0; if (S.follow) { S.time = nowMin(); S.serviceId = serviceForTime(S.time); }
    render();
  });
  const cd = $('#ctxDate'); if (cd) cd.onchange = () => { if (cd.value) { S.date = cd.value; S.follow = false; render(); } };
  const cs = $('#ctxSvc'); if (cs) cs.onchange = () => { S.serviceId = cs.value; S.follow = false; S.time = toMin(svcById(cs.value).start) + 60; render(); };
  $('#themeBtn').onclick = () => { DB.theme = DB.theme === 'dark' ? 'light' : 'dark'; save(); render(); };
  $('#logoutBtn').onclick = logout;
}

function render() {
  document.documentElement.dataset.theme = DB.theme;
  if (!S.user) return renderLogin();
  if (!ROLE_VIEWS[S.user.role].includes(S.view)) S.view = ROLE_VIEWS[S.user.role][0];
  if (!S.serviceId || !svcById(S.serviceId)) S.serviceId = serviceForTime(S.time);
  if (!S.roomId || !roomById(S.roomId)) S.roomId = DB.rooms[0] && DB.rooms[0].id;
  // Scrollpositionen merken
  const keep = {}; $$('[data-keep]').forEach(el => keep[el.dataset.keep] = [el.scrollLeft, el.scrollTop]);
  $('#app').innerHTML = headerHTML() + '<main id="main"></main>';
  bindHeader();
  const main = $('#main');
  ({ live: viewLive, zeit: viewGantt, res: viewResList, hotel: viewHotel, berichte: viewReports, editor: viewEditor, settings: viewSettings })[S.view](main);
  $$('[data-keep]').forEach(el => { const k = keep[el.dataset.keep]; if (k) { el.scrollLeft = k[0]; el.scrollTop = k[1]; } });
}

/* =========================================================
   9) Ansicht: Live-Tischplan
   ========================================================= */
function viewLive(main) {
  const room = roomById(S.roomId), svc = svcById(S.serviceId);
  const tm = S.time;
  const list = DB.reservations.filter(r => r.date === S.date && r.serviceId === S.serviceId)
    .sort((a, b) => resStart(a) - resStart(b) || a.name.localeCompare(b.name));
  const act = list.filter(r => r.status !== 'storniert' && r.status !== 'noshow');
  const covers = act.reduce((a, r) => a + persons(r), 0);
  const seated = act.filter(r => SEATED_STATES.includes(r.status)).reduce((a, r) => a + persons(r), 0);
  const unassigned = act.filter(r => !(r.tableIds || []).length && r.status !== 'abgeschlossen').length;
  const freeNow = DB.tables.filter(x => tableStatusAt(x, S.date, S.serviceId, tm).st === 'frei').length;
  const showOpen = S.liveOpenOnly;
  const shown = showOpen ? list.filter(r => occupies(r)) : list;
  main.innerHTML = `<div class="live">
    <div class="panel">
      <div class="roomtabs">${DB.rooms.map(r => `<button class="btn small ${r.id === S.roomId ? 'on' : ''}" data-room="${r.id}">${esc(r.name)}</button>`).join('')}
        <span class="spacer" style="flex:1"></span>
        <label class="chk"><input type="checkbox" id="stToggle" ${S.showStations ? 'checked' : ''}> Reviere</label>
        <input type="time" id="liveTime" value="${fromMin(tm)}" step="300" style="width:auto">
        <button class="btn small ${S.follow ? 'on' : ''}" id="nowBtn">Jetzt</button>
      </div>
      <div class="plan-wrap">${room ? planSVG(room, { mode: 'live', showStations: S.showStations, status: tb => tableStatusAt(tb, S.date, S.serviceId, tm) }) : '<p class="muted">Kein Raum angelegt.</p>'}</div>
      ${legendHTML()}
    </div>
    <div class="panel">
      <div class="kpis"><div class="kpi"><b>${act.length}</b><small>Reserv.</small></div><div class="kpi"><b>${covers}</b><small>Gäste</small></div>
        <div class="kpi"><b>${seated}</b><small>im Haus</small></div><div class="kpi"><b>${freeNow}</b><small>Tische frei</small></div>
        <div class="kpi" style="${unassigned ? 'color:var(--danger)' : ''}"><b>${unassigned}</b><small>ohne Tisch</small></div></div>
      <div class="row" style="padding:10px 12px;border-bottom:1px solid var(--line)">
        ${canEdit() ? `<button class="btn primary" id="newRes">＋ Reservierung</button><button class="btn" id="walkin">🚶 Walk-in</button>` : ''}
        <label class="chk"><input type="checkbox" id="openOnly" ${showOpen ? 'checked' : ''}> nur aktive</label></div>
      <div class="reslist" data-keep="liveList">
        ${shown.length ? shown.map(r => resItemHTML(r)).join('') : `<p class="muted" style="padding:12px">Keine Reservierungen für ${esc(svc.name)}.</p>`}
      </div>
      ${canEdit() ? '<p class="muted" style="font-size:12px;padding:8px 12px;margin:0">Tipp: Reservierung aus der Liste auf einen Tisch ziehen.</p>' : ''}
    </div></div>`;

  $$('[data-room]', main).forEach(b => b.onclick = () => { S.roomId = b.dataset.room; render(); });
  $('#stToggle').onchange = e => { S.showStations = e.target.checked; render(); };
  $('#openOnly').onchange = e => { S.liveOpenOnly = e.target.checked; render(); };
  $('#liveTime').onchange = e => { S.time = toMin(e.target.value); S.follow = false; render(); };
  $('#nowBtn').onclick = () => { S.follow = true; S.date = today(); S.time = nowMin(); S.serviceId = serviceForTime(S.time); render(); };
  if ($('#newRes')) $('#newRes').onclick = () => openResForm(null, {});
  if ($('#walkin')) $('#walkin').onclick = () => openWalkin();

  // Tische: Klick = Details, Ziehen = Reservierung verschieben
  $$('.tb', main).forEach(g => g.addEventListener('pointerdown', e => {
    const tb = tblById(g.dataset.tableId), s = tableStatusAt(tb, S.date, S.serviceId, tm);
    startDrag(e, {
      label: s.r ? `${s.r.name} → ?` : tb.name,
      onClick: () => openTablePopup(tb),
      onDrop: el => {
        const to = dropTableId(el);
        if (!s.r || !canEdit() || !to || to === tb.id) return;
        applyRes(s.r, d => { d.tableIds = d.tableIds.map(x => x === tb.id ? to : x); }, 'Tisch gewechselt');
      }
    });
  }));
  // Liste: Klick = bearbeiten, Ziehen auf Tisch = zuweisen
  $$('.ritem', main).forEach(it => it.addEventListener('pointerdown', e => {
    const r = DB.reservations.find(x => x.id === it.dataset.res);
    startDrag(e, {
      label: `${r.name} (${persons(r)}P)`,
      onClick: () => canEdit() ? openResForm(r) : openResInfo(r),
      onDrop: el => { const to = dropTableId(el); if (to && canEdit()) applyRes(r, d => { d.tableIds = [to]; }, 'Tisch zugewiesen'); }
    });
  }));
}
function resItemHTML(r, showDate) {
  const unas = occupies(r) && !(r.tableIds || []).length;
  const w = conflicts(r);
  return `<div class="ritem ${unas ? 'unassigned' : ''} ${occupies(r) || r.status === 'abgeschlossen' ? '' : 'cancel'}" data-res="${r.id}">
    <div class="time">${showDate ? fmtShort(r.date) + '<br>' : ''}${r.time}</div>
    <div class="main"><div class="name">${r.vip ? '★ ' : ''}${esc(r.name)}</div>
      <div class="sub">${persons(r)} P${r.children ? ` (${r.children} Ki.)` : ''} · ${(r.tableIds || []).length ? 'Tisch ' + esc(tblNames(r.tableIds)) : '<b style="color:var(--danger)">ohne Tisch</b>'}
      ${r.allergies ? ' · ⚠ ' + esc(r.allergies) : ''}${r.occasion ? ' · 🎉 ' + esc(r.occasion) : ''}</div></div>
    <div style="text-align:right">${r.stayId ? '<span class="badge hotel">Hotel</span><br>' : ''}<span class="badge st" style="background:${RES_STATUS[r.status]}">${t(r.status)}</span>
      ${w.length ? `<br><span class="badge warn" title="${esc(w.join('\n'))}">⚠ ${w.length}</span>` : ''}</div></div>`;
}

/** Popup beim Antippen eines Tisches */
function openTablePopup(tb) {
  const s = tableStatusAt(tb, S.date, S.serviceId, S.time);
  const r = s.r && (SEATED_STATES.includes(s.r.status) || s.st !== 'bald' ? s.r : s.r);
  const dayRes = DB.reservations.filter(x => x.date === S.date && (x.tableIds || []).includes(tb.id) && x.status !== 'storniert')
    .sort((a, b) => resStart(a) - resStart(b));
  const blocked = isBlocked(tb, S.date, S.serviceId);
  const st = DB.stations.find(x => x.id === tb.station);
  let body = `<p class="muted" style="margin-top:0">${tb.min}–${tb.max} Personen · ${esc(roomById(tb.roomId).name)}${st ? ' · ' + esc(st.name) : ''}
    ${(tb.props || []).length ? '<br>' + tb.props.map(t).join(', ') : ''} · Status: <b>${t(s.st)}</b></p>`;
  if (r) {
    const stay = r.stayId && stayById(r.stayId);
    body += `<div class="infobox"><b>${r.vip ? '★ ' : ''}${esc(r.name)}</b> · ${persons(r)} P${r.children ? ` (${r.children} Kinder)` : ''} · ${r.time}–${fromMin(resEnd(r))}
      ${stay ? `<br>Hotelgast Zi. ${esc(stay.room)} · ${t(stay.board)} · bis ${fmtShort(stay.departure)}` : ''}
      ${r.allergies ? `<br>⚠ <b>${esc(r.allergies)}</b>` : ''}${r.occasion ? `<br>🎉 ${esc(r.occasion)}` : ''}${r.highchair ? '<br>Kinderstuhl' : ''}
      ${r.notes ? `<br>📝 ${esc(r.notes)}` : ''}<br>Status: <b>${t(r.status)}</b> · Tisch(e): ${esc(tblNames(r.tableIds))}</div>`;
    if (canStatus()) body += `<div class="stbtns">${['eingetroffen', 'platziert', 'rechnung', 'abgeschlossen', 'noshow', 'storniert']
      .map(x => `<button class="btn ${r.status === x ? 'on' : ''}" data-st="${x}" style="border-left:5px solid ${RES_STATUS[x]}">${t(x)}</button>`).join('')}</div>`;
    if (canEdit()) {
      const freeT = DB.tables.filter(x => x.id !== tb.id && !(r.tableIds || []).includes(x.id) && !tableBusy(x.id, r.date, resStart(r), resEnd(r), r.id).length);
      body += `<div class="row" style="margin-top:12px"><select id="addTbl" style="width:auto"><option value="">Tisch dazunehmen…</option>${freeT.map(x => `<option value="${x.id}">${esc(x.name)} (${x.max}P, ${esc(roomById(x.roomId).name)})</option>`).join('')}</select>
        ${(r.tableIds || []).length > 1 ? `<button class="btn" id="splitTbl">${esc(tb.name)} abtrennen</button>` : ''}</div>`;
    }
  } else if (!blocked && canEdit()) {
    body += `<div class="row"><button class="btn primary" id="wiHere">🚶 Walk-in hier platzieren</button><button class="btn" id="resHere">＋ Reservierung für diesen Tisch</button></div>`;
  }
  if (blocked) body += `<div class="warnbox">Gesperrt: ${esc((tb.blocks.find(b => b.date === S.date && (!b.serviceId || b.serviceId === S.serviceId)) || {}).reason || '')}</div>`;
  body += `<h4 style="margin:16px 0 6px">Heute an diesem Tisch</h4>${dayRes.length ? dayRes.map(x => `<div class="row" style="font-size:13px;padding:3px 0">
    <b>${x.time}–${fromMin(resEnd(x))}</b> ${esc(x.name)} · ${persons(x)}P <span class="badge st" style="background:${RES_STATUS[x.status]}">${t(x.status)}</span></div>`).join('') : '<p class="muted">Keine Reservierungen.</p>'}`;
  const btns = [];
  if (canEdit()) btns.push({ label: blocked ? 'Sperre aufheben' : 'Tisch sperren', action: () => toggleBlock(tb, blocked) });
  if (r && canEdit()) btns.push({ label: 'Reservierung bearbeiten', cls: 'primary', action: () => setTimeout(() => openResForm(r), 0) });
  btns.push({ label: 'Schließen' });
  openModal('Tisch ' + tb.name, body, btns, bg => {
    $$('[data-st]', bg).forEach(b => b.onclick = () => { setStatus(r, b.dataset.st); closeModal(); });
    const at = $('#addTbl', bg); if (at) at.onchange = () => { if (at.value) { closeModal(); applyRes(r, d => d.tableIds.push(at.value), 'Tische zusammengelegt'); } };
    const sp = $('#splitTbl', bg); if (sp) sp.onclick = () => { closeModal(); applyRes(r, d => { d.tableIds = d.tableIds.filter(x => x !== tb.id); }, 'Tisch abgetrennt'); };
    const wh = $('#wiHere', bg); if (wh) wh.onclick = () => { closeModal(); openWalkin(tb); };
    const rh = $('#resHere', bg); if (rh) rh.onclick = () => { closeModal(); openResForm(null, { tableIds: [tb.id], time: fromMin(Math.max(toMin(svcById(S.serviceId).start), Math.ceil(S.time / 15) * 15)) }); };
  });
}
function toggleBlock(tb, blocked) {
  if (blocked) {
    tb.blocks = tb.blocks.filter(b => !(b.date === S.date && (!b.serviceId || b.serviceId === S.serviceId)));
    log('Tischsperre aufgehoben', tb.name); save(); render(); return;
  }
  setTimeout(() => openModal('Tisch ' + tb.name + ' sperren', `<div class="grid2"><label>Datum<input type="date" id="bDate" value="${S.date}"></label>
    <label>Service<select id="bSvc"><option value="">ganzer Tag</option>${DB.services.map(s => `<option value="${s.id}" ${s.id === S.serviceId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label></div>
    <label>Grund<input id="bReason" placeholder="z. B. defekt, Event, Personal"></label>`,
    [{ label: 'Abbrechen' }, { label: 'Sperren', cls: 'primary', action: bg => {
      tb.blocks.push({ date: $('#bDate', bg).value, serviceId: $('#bSvc', bg).value || null, reason: $('#bReason', bg).value });
      log('Tisch gesperrt', tb.name); save(); render();
    } }]), 0);
}
function setStatus(r, st) {
  const old = r.status; r.status = st;
  if (st === 'platziert' && old !== 'platziert' && r.date === today()) {
    // Ankunftszeit festhalten (für spätere Auswertungen der Verweildauer)
    r.seatedAt = nowMin();
  }
  if (st === 'abgeschlossen' && r.seatedAt != null && r.date === today()) r.finishedAt = nowMin();
  log('Status geändert', `${r.name}: ${t(old)} → ${t(st)}`); save(); render();
}
function openResInfo(r) {
  openModal(r.name, `<p>${fmtDate(r.date)} · ${r.time} · ${persons(r)} P · Tisch ${esc(tblNames(r.tableIds) || '–')}</p>
    ${r.allergies ? `<div class="warnbox">Allergien: ${esc(r.allergies)}</div>` : ''}${r.notes ? `<p>📝 ${esc(r.notes)}</p>` : ''}
    ${canStatus() ? `<div class="stbtns">${['eingetroffen', 'platziert', 'rechnung', 'abgeschlossen', 'noshow'].map(x => `<button class="btn ${r.status === x ? 'on' : ''}" data-st="${x}">${t(x)}</button>`).join('')}</div>` : ''}`,
    [{ label: 'Schließen' }], bg => $$('[data-st]', bg).forEach(b => b.onclick = () => { setStatus(r, b.dataset.st); closeModal(); }));
}

/** Walk-in: Personenzahl → Tischvorschläge → sofort platzieren */
function openWalkin(fixedTable) {
  const st = { p: 2, name: '' };
  const draw = bg => {
    $('#wiP', bg).textContent = st.p;
    const tm = Math.max(S.date === today() ? nowMin() : S.time, 0);
    const draft = { id: '_new', date: S.date, serviceId: S.serviceId, time: fromMin(Math.round(tm / 5) * 5), adults: st.p, children: 0, duration: turnTime(S.serviceId, st.p), status: 'platziert', tableIds: [] };
    const sug = fixedTable ? [{ ids: [fixedTable.id] }] : suggestTables(draft, 8);
    $('#wiSug', bg).innerHTML = sug.length ? sug.map((s, i) => `<button class="btn ${i === 0 ? 'primary' : ''}" data-ids="${s.ids.join(',')}">${esc(tblNames(s.ids))} (${capOf(s.ids).max}P)</button>`).join('')
      : '<span class="warnbox">Aktuell kein passender Tisch frei.</span>';
    $$('[data-ids]', bg).forEach(b => b.onclick = () => {
      const r = Object.assign(draft, { id: uid(), name: $('#wiName', bg).value || 'Walk-in', source: 'Walk-in', tableIds: b.dataset.ids.split(','), createdAt: Date.now(), seatedAt: nowMin() });
      const w = conflicts(r);
      const commit = () => { DB.reservations.push(r); log('Walk-in platziert', `${r.name} ${r.adults}P → ${tblNames(r.tableIds)}`); save(); render(); toast('Walk-in platziert'); };
      closeModal(); if (w.length) confirmModal('Bitte prüfen', w, commit, 'Trotzdem platzieren'); else commit();
    });
  };
  openModal('Walk-in' + (fixedTable ? ' an ' + fixedTable.name : ''), `<div class="row" style="justify-content:center;gap:16px">
      <button class="btn" id="wiMinus" style="font-size:24px;min-width:60px">−</button><b id="wiP" style="font-size:36px;min-width:50px;text-align:center"></b>
      <button class="btn" id="wiPlus" style="font-size:24px;min-width:60px">＋</button><span class="muted">Personen</span></div>
    <label style="margin-top:12px">Name (optional)<input id="wiName" placeholder="Walk-in"></label>
    <h4 style="margin:14px 0 6px">${fixedTable ? 'Tisch' : 'Freie Tische (beste Passung zuerst)'}</h4><div class="sugg" id="wiSug"></div>`,
    [{ label: 'Abbrechen' }], bg => {
      $('#wiMinus', bg).onclick = () => { st.p = Math.max(1, st.p - 1); draw(bg); };
      $('#wiPlus', bg).onclick = () => { st.p = Math.min(40, st.p + 1); draw(bg); };
      draw(bg);
    });
}

/* =========================================================
   10) Reservierungsformular (Neu / Bearbeiten)
   ========================================================= */
function openResForm(r, preset = {}) {
  if (!canEdit()) return r && openResInfo(r);
  const isNew = !r;
  const svc0 = svcById(preset.serviceId || S.serviceId);
  const d = r ? JSON.parse(JSON.stringify(r)) : Object.assign({
    id: '_new', date: S.date, serviceId: svc0.id, time: svc0.hotelTime || svc0.start, adults: 2, children: 0, duration: 0,
    name: '', phone: '', email: '', notes: '', occasion: '', allergies: '', highchair: false, vip: false, source: 'Telefon',
    status: 'bestaetigt', tableIds: [], wishes: [], stayId: null
  }, preset);
  let durAuto = isNew || d.duration === turnTime(d.serviceId, persons(d));
  if (!d.duration) d.duration = turnTime(d.serviceId, persons(d));
  d.wishes = d.wishes || [];
  const opt = (arr, val, lbl = x => x) => arr.map(x => `<option value="${esc(x)}" ${x === val ? 'selected' : ''}>${esc(lbl(x) || '–')}</option>`).join('');
  const body = `<div class="grid3">
      <label>Datum<input type="date" id="f_date" value="${d.date}"></label>
      <label>Service<select id="f_svc">${DB.services.map(s => `<option value="${s.id}" ${s.id === d.serviceId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
      <label>Uhrzeit<input type="time" id="f_time" value="${d.time}" step="900"></label></div>
    <div class="sugg" id="f_seatings"></div>
    <div class="grid3" style="margin-top:8px">
      <label>Erwachsene<input type="number" id="f_ad" min="0" max="99" value="${d.adults}"></label>
      <label>Kinder<input type="number" id="f_ch" min="0" max="99" value="${d.children}"></label>
      <label>Dauer (Min.) <span id="f_durinfo"></span><input type="number" id="f_dur" min="15" step="15" value="${d.duration}"></label></div>
    <div class="grid2" style="margin-top:8px">
      <label>Name *<input id="f_name" value="${esc(d.name)}" autocomplete="off"></label>
      <label>Telefon<input id="f_phone" type="tel" value="${esc(d.phone)}"></label>
      <label>E-Mail<input id="f_mail" type="email" value="${esc(d.email)}"></label>
      <label>Quelle<select id="f_src">${opt(SOURCES, d.source)}</select></label>
      <label>Anlass<select id="f_occ">${opt(OCCASIONS, d.occasion)}</select></label>
      <label>Status<select id="f_st">${opt(Object.keys(RES_STATUS), d.status, t)}</select></label></div>
    <label style="margin-top:8px">Hotelgast verknüpfen<select id="f_stay"></select></label>
    <label style="margin-top:8px">Allergien / Unverträglichkeiten<input id="f_all" value="${esc(d.allergies)}" placeholder="z. B. Gluten, Nüsse"></label>
    <label style="margin-top:8px">Notizen<textarea id="f_notes">${esc(d.notes)}</textarea></label>
    <div class="row" style="margin-top:8px"><label class="chk"><input type="checkbox" id="f_hc" ${d.highchair ? 'checked' : ''}> Kinderstuhl</label>
      <label class="chk"><input type="checkbox" id="f_vip" ${d.vip ? 'checked' : ''}> VIP</label>
      <span class="muted">Wünsche:</span>${PROPS.map(p => `<label class="chk"><input type="checkbox" data-wish="${p}" ${d.wishes.includes(p) ? 'checked' : ''}> ${t(p)}</label>`).join('')}</div>
    <h4 style="margin:14px 0 6px">Tisch(e)</h4>
    <div class="row" id="f_tables"></div>
    <div class="row" style="margin-top:6px"><select id="f_addT" style="width:auto"></select></div>
    <div class="muted" style="font-size:12px;margin-top:8px">Vorschläge:</div><div class="sugg" id="f_sugg"></div>
    ${isNew ? `<label style="margin-top:12px">Wöchentlich wiederholen (Stammtisch) – Anzahl weiterer Wochen<input type="number" id="f_rep" min="0" max="52" value="0"></label>` : ''}
    <div id="f_warn"></div>`;
  const buttons = [];
  if (!isNew) buttons.push({ label: 'Löschen', cls: 'danger', keep: true, action: () => {
    confirmModal('Reservierung löschen?', [`${r.name} – ${fmtDate(r.date)} ${r.time}`], () => {
      DB.reservations.splice(DB.reservations.indexOf(r), 1); log('Reservierung gelöscht', r.name); save(); render(); toast('Gelöscht');
    }, 'Endgültig löschen');
  } });
  buttons.push({ label: 'Abbrechen' }, { label: 'Speichern', cls: 'primary', keep: true, action: () => saveForm() });

  const bg = openModal(isNew ? 'Neue Reservierung' : 'Reservierung bearbeiten', body, buttons);
  const read = () => {
    d.date = $('#f_date', bg).value; d.serviceId = $('#f_svc', bg).value; d.time = $('#f_time', bg).value || d.time;
    d.adults = +$('#f_ad', bg).value || 0; d.children = +$('#f_ch', bg).value || 0;
    if (durAuto) { d.duration = turnTime(d.serviceId, persons(d)); $('#f_dur', bg).value = d.duration; } else d.duration = +$('#f_dur', bg).value || 15;
    d.name = $('#f_name', bg).value.trim(); d.phone = $('#f_phone', bg).value.trim(); d.email = $('#f_mail', bg).value.trim();
    d.source = $('#f_src', bg).value; d.occasion = $('#f_occ', bg).value; d.status = $('#f_st', bg).value;
    d.allergies = $('#f_all', bg).value.trim(); d.notes = $('#f_notes', bg).value; d.highchair = $('#f_hc', bg).checked; d.vip = $('#f_vip', bg).checked;
    d.wishes = $$('[data-wish]', bg).filter(x => x.checked).map(x => x.dataset.wish);
  };
  const draw = () => {
    const s = svcById(d.serviceId);
    $('#f_durinfo', bg).innerHTML = durAuto ? '<span class="badge">auto</span>' : '<a href="#" id="f_durauto" style="font-size:11px">auto</a>';
    const da = $('#f_durauto', bg); if (da) da.onclick = e => { e.preventDefault(); durAuto = true; read(); draw(); };
    $('#f_seatings', bg).innerHTML = (s.seatings || []).map(x => `<button class="btn small" data-seat="${x}">${x} Seating</button>`).join('');
    $$('[data-seat]', bg).forEach(b => b.onclick = () => { $('#f_time', bg).value = b.dataset.seat; read(); draw(); });
    const inHouse = DB.stays.filter(x => isInHouse(x, d.date)).sort((a, b) => a.room.localeCompare(b.room));
    $('#f_stay', bg).innerHTML = `<option value="">– kein Hotelgast –</option>` + inHouse.map(x => `<option value="${x.id}" ${x.id === d.stayId ? 'selected' : ''}>Zi. ${esc(x.room)} · ${esc(x.name)} (${x.adults + x.children}P, ${x.board})</option>`).join('');
    $('#f_tables', bg).innerHTML = d.tableIds.length ? d.tableIds.map(id => `<span class="badge" style="font-size:14px;padding:6px 10px">${esc((tblById(id) || {}).name)} <a href="#" data-rm="${id}">✕</a></span>`).join('')
      + `<span class="muted">Kapazität ${capOf(d.tableIds).max} P</span>` : '<span class="muted">Noch kein Tisch – Vorschlag wählen oder später im Plan zuweisen.</span>';
    $$('[data-rm]', bg).forEach(a => a.onclick = e => { e.preventDefault(); d.tableIds = d.tableIds.filter(x => x !== a.dataset.rm); draw(); });
    $('#f_addT', bg).innerHTML = `<option value="">Tisch manuell hinzufügen…</option>` + DB.rooms.map(rm => `<optgroup label="${esc(rm.name)}">${DB.tables.filter(x => x.roomId === rm.id && !d.tableIds.includes(x.id))
      .map(x => `<option value="${x.id}">${esc(x.name)} (${x.min}–${x.max}P)${tableBusy(x.id, d.date, resStart(d), resEnd(d), d.id).length ? ' – belegt' : ''}</option>`).join('')}</optgroup>`).join('');
    const sug = suggestTables(d, 6);
    $('#f_sugg', bg).innerHTML = sug.length ? sug.map(x => `<button class="btn small" data-sg="${x.ids.join(',')}">${esc(tblNames(x.ids))} · ${capOf(x.ids).max}P · ${esc(roomById(tblById(x.ids[0]).roomId).name)}</button>`).join('') : '<span class="muted">Kein passender freier Tisch.</span>';
    $$('[data-sg]', bg).forEach(b => b.onclick = () => { d.tableIds = b.dataset.sg.split(','); draw(); });
    const w = conflicts(d);
    $('#f_warn', bg).innerHTML = w.length ? `<div class="warnbox">${w.map(esc).join('<br>')}</div>` : (d.tableIds.length ? '<div class="infobox">Keine Konflikte.</div>' : '');
  };
  bg.addEventListener('input', e => { if (e.target.id === 'f_dur') durAuto = false; if (e.target.id !== 'f_stay' && e.target.id !== 'f_addT') { read(); if (['f_date', 'f_svc', 'f_time', 'f_ad', 'f_ch', 'f_dur'].includes(e.target.id) || e.target.dataset.wish) draw(); else { const w = conflicts(d); $('#f_warn', bg).innerHTML = w.length ? `<div class="warnbox">${w.map(esc).join('<br>')}</div>` : ''; } } });
  bg.addEventListener('change', e => {
    if (e.target.id === 'f_svc') { const s = svcById(e.target.value); $('#f_time', bg).value = s.hotelTime || s.start; read(); draw(); }
    if (e.target.id === 'f_addT' && e.target.value) { d.tableIds.push(e.target.value); draw(); }
    if (e.target.id === 'f_stay') {
      const st = stayById(e.target.value); d.stayId = st ? st.id : null;
      if (st) { $('#f_name', bg).value = `${st.name} · Zi. ${st.room}`; $('#f_ad', bg).value = st.adults; $('#f_ch', bg).value = st.children;
        if (st.allergies) $('#f_all', bg).value = st.allergies; $('#f_src', bg).value = 'Hotel'; $('#f_vip', bg).checked = !!st.vip; }
      read(); draw();
    }
  });
  draw();
  setTimeout(() => { const n = $('#f_name', bg); if (n && isNew) n.focus(); }, 30);

  function saveForm() {
    read();
    if (!d.name) { toast('Bitte Namen eingeben', 'err'); return; }
    if (persons(d) < 1) { toast('Personenanzahl fehlt', 'err'); return; }
    const reps = isNew ? Math.min(52, +($('#f_rep', bg) || {}).value || 0) : 0;
    const commit = () => {
      if (isNew) {
        const base = Object.assign({}, d, { id: uid(), createdAt: Date.now() }); DB.reservations.push(base);
        for (let i = 1; i <= reps; i++) {
          const c = Object.assign({}, base, { id: uid(), date: addDays(base.date, 7 * i), seriesOf: base.id, tableIds: [...base.tableIds] });
          if (c.tableIds.some(tid => tableBusy(tid, c.date, resStart(c), resEnd(c), c.id).length)) c.tableIds = [];
          DB.reservations.push(c);
        }
        log('Reservierung angelegt', `${d.name} ${d.date} ${d.time} ${persons(d)}P${reps ? ` (+${reps} Wiederholungen)` : ''}`);
      } else {
        if (r.stayId && JSON.stringify(r.tableIds) !== JSON.stringify(d.tableIds)) d.manualTable = true;
        Object.assign(r, d); log('Reservierung geändert', `${d.name} ${d.date} ${d.time}`);
      }
      save(); closeModal(); render(); toast('Gespeichert');
    };
    const w = conflicts(d);
    if (w.length) {
      // Formular offen lassen, Bestätigung als eigenes Fenster darüber
      const keepBody = bg; keepBody.style.display = 'none';
      const box = document.createElement('div'); box.className = 'modal-bg'; box.style.zIndex = 150;
      box.innerHTML = `<div class="modal" style="max-width:480px"><div class="mh"><h2>Bitte prüfen</h2></div><div class="mb"><div class="warnbox">${w.map(esc).join('<br>')}</div></div>
        <div class="mf"><button class="btn" data-no>Zurück</button><button class="btn primary" data-yes>Trotzdem speichern</button></div></div>`;
      document.body.appendChild(box);
      $('[data-no]', box).onclick = () => { box.remove(); keepBody.style.display = ''; };
      $('[data-yes]', box).onclick = () => { box.remove(); commit(); };
    } else commit();
  }
}

/* =========================================================
   11) Ansicht: Zeitleiste (Gantt) – Tische × Uhrzeit
   ========================================================= */
function viewGantt(main) {
  const svc = svcById(S.serviceId);
  const PX = 2.2, from = toMin(svc.start) - 30, to = Math.min(24 * 60, toMin(svc.end) + Math.max(...svc.turn.map(x => x.min)) - 30);
  const W = (to - from) * PX, x = m => (m - from) * PX;
  const dayRes = DB.reservations.filter(r => r.date === S.date && occupies(r) && overlaps(resStart(r), resEnd(r), from, to) || (r.date === S.date && r.status === 'abgeschlossen' && r.serviceId === S.serviceId));
  const ticks = []; for (let m = Math.ceil(from / 30) * 30; m < to; m += 30) ticks.push(`<div class="g-tick ${m % 60 ? 'half' : ''}" style="left:${x(m)}px">${m % 60 ? '' : fromMin(m)}</div>`);
  const headTicks = ticks.join(''), tickHTML = headTicks.replace(/>\d\d:\d\d</g, '><');
  const nowL = S.date === today() && nowMin() > from && nowMin() < to ? `<div class="g-now" style="left:${x(nowMin())}px"></div>` : '';
  const bar = (r, tid) => {
    const w = conflicts(r).filter(z => z.startsWith('Überschneidung') || z.startsWith('Tisch zu') || z.includes('gesperrt'));
    return `<div class="g-bar ${w.length ? 'conflict' : ''}" data-res="${r.id}" data-from="${tid || ''}" title="${esc(r.name + ' · ' + persons(r) + 'P · ' + r.time + '–' + fromMin(resEnd(r)) + (w.length ? '\n' + w.join('\n') : ''))}"
      style="left:${x(resStart(r))}px;width:${Math.max(18, r.duration * PX - 2)}px;background:${RES_STATUS[r.status]}">${r.stayId ? '⌂ ' : ''}${r.vip ? '★ ' : ''}${esc(r.name)} · ${persons(r)}P${r.allergies ? ' ⚠' : ''}${canEdit() ? '<span class="rs"></span>' : ''}</div>`;
  };
  // Reservierungen ohne Tisch auf Spuren verteilen
  const unas = dayRes.filter(r => !(r.tableIds || []).length && r.serviceId === S.serviceId).sort((a, b) => resStart(a) - resStart(b));
  const lanes = []; for (const r of unas) { let l = lanes.find(L => resStart(r) >= resEnd(L[L.length - 1])); if (!l) lanes.push(l = []); l.push(r); }
  let rows = `<div class="g-row group"><div class="g-label" style="color:var(--danger)">Ohne Tisch (${unas.length})</div><div class="g-track" style="width:${W}px">${tickHTML}</div></div>`;
  (lanes.length ? lanes : [[]]).forEach(l => rows += `<div class="g-row" data-unassigned="1"><div class="g-label muted">—</div><div class="g-track" style="width:${W}px">${tickHTML}${nowL}${l.map(r => bar(r, '')).join('')}</div></div>`);
  for (const room of DB.rooms) {
    rows += `<div class="g-row group"><div class="g-label">${esc(room.name)}</div><div class="g-track" style="width:${W}px"></div></div>`;
    for (const tb of DB.tables.filter(z => z.roomId === room.id)) {
      const bl = isBlocked(tb, S.date, S.serviceId);
      const st = DB.stations.find(z => z.id === tb.station);
      rows += `<div class="g-row" data-table-id="${tb.id}"><div class="g-label"><i style="width:8px;height:8px;border-radius:50%;background:${st ? st.color : 'transparent'};display:inline-block"></i><b>${esc(tb.name)}</b><span class="muted">${tb.min}–${tb.max}P</span>${bl ? ' <span class="badge">gesperrt</span>' : ''}</div>
        <div class="g-track" style="width:${W}px;${bl ? 'background:repeating-linear-gradient(45deg,transparent 0 8px,var(--panel2) 8px 16px)' : ''}">${tickHTML}${nowL}
        ${dayRes.filter(r => (r.tableIds || []).includes(tb.id)).map(r => bar(r, tb.id)).join('')}</div></div>`;
    }
  }
  main.innerHTML = `<div class="panel"><div class="row" style="padding:10px 14px;border-bottom:1px solid var(--line)"><b>${esc(svc.name)} · ${fmtDate(S.date)}</b>
    <span class="muted" style="font-size:13px">${canEdit() ? 'Balken ziehen = Uhrzeit/Tisch ändern · rechten Rand ziehen = Dauer · Klick = bearbeiten' : 'Klick auf Balken = Details'}</span>
    <span style="flex:1"></span>${canEdit() ? '<button class="btn primary" id="gNew">＋ Reservierung</button>' : ''}</div>
    <div class="gantt" data-keep="gantt"><div class="g-head"><div class="g-label muted">Tisch</div><div class="g-track" style="width:${W}px">${headTicks}</div></div>${rows}</div></div>`;
  if ($('#gNew')) $('#gNew').onclick = () => openResForm(null, {});

  $$('.g-bar', main).forEach(el => el.addEventListener('pointerdown', e => {
    const r = DB.reservations.find(z => z.id === el.dataset.res);
    if (!canEdit()) { const up = () => { window.removeEventListener('pointerup', up); openResInfo(r); }; window.addEventListener('pointerup', up); return; }
    e.preventDefault();
    const resize = e.target.classList.contains('rs'), sx = e.clientX, sy = e.clientY, w0 = el.offsetWidth; let moved = false;
    const mv = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 6) return; moved = true; DRAGGING = true;
      if (resize) el.style.width = Math.max(20, w0 + dx) + 'px';
      else { el.style.transform = `translate(${snap(dx, 15 * PX)}px, ${dy}px)`; el.style.zIndex = 10; el.style.pointerEvents = 'none'; }
    };
    const up = ev => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); setTimeout(() => DRAGGING = false, 0);
      if (!moved) return openResForm(r);
      const dx = ev.clientX - sx;
      if (resize) { const dur = Math.max(15, snap((w0 + dx) / PX, 15)); return applyRes(r, z => { z.duration = dur; }, 'Dauer geändert'); }
      el.style.pointerEvents = '';
      const target = document.elementFromPoint(ev.clientX, ev.clientY), row = target && target.closest('.g-row');
      const dMin = snap(dx / PX, 15), fromT = el.dataset.from;
      applyRes(r, z => {
        z.time = fromMin(resStart(z) + dMin);
        if (row && row.dataset.tableId && row.dataset.tableId !== fromT) z.tableIds = fromT ? z.tableIds.map(q => q === fromT ? row.dataset.tableId : q) : [row.dataset.tableId];
        else if (row && row.dataset.unassigned) z.tableIds = [];
      }, 'In Zeitleiste verschoben');
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  }));
}

/* =========================================================
   12) Ansicht: Reservierungsliste mit Filtern
   ========================================================= */
function viewResList(main) {
  const F = Object.assign({ from: S.date, to: addDays(S.date, 6), svc: '', status: 'aktiv', q: '', hotel: false, unas: false }, S.resFilter);
  S.resFilter = F;
  const q = F.q.toLowerCase();
  const rows = DB.reservations.filter(r => r.date >= F.from && r.date <= F.to && (!F.svc || r.serviceId === F.svc) &&
    (F.status === 'alle' || (F.status === 'aktiv' ? occupies(r) : r.status === F.status)) &&
    (!F.hotel || r.stayId) && (!F.unas || !(r.tableIds || []).length) &&
    (!q || [r.name, r.phone, r.email, r.notes, r.allergies].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => a.date.localeCompare(b.date) || resStart(a) - resStart(b));
  main.innerHTML = `<div class="panel"><div class="filters">
      <label>Von<input type="date" data-f="from" value="${F.from}"></label><label>Bis<input type="date" data-f="to" value="${F.to}"></label>
      <label>Service<select data-f="svc"><option value="">alle</option>${DB.services.map(s => `<option value="${s.id}" ${F.svc === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
      <label>Status<select data-f="status">${['aktiv', 'alle', ...Object.keys(RES_STATUS)].map(s => `<option value="${s}" ${F.status === s ? 'selected' : ''}>${s === 'aktiv' ? 'aktive' : s === 'alle' ? 'alle' : t(s)}</option>`).join('')}</select></label>
      <label>Suche<input data-f="q" value="${esc(F.q)}" placeholder="Name, Telefon, Notiz…"></label>
      <label class="chk" style="align-self:flex-end"><input type="checkbox" data-f="hotel" ${F.hotel ? 'checked' : ''}> nur Hotelgäste</label>
      <label class="chk" style="align-self:flex-end"><input type="checkbox" data-f="unas" ${F.unas ? 'checked' : ''}> nur ohne Tisch</label>
      <span style="flex:1"></span>

function downloadCSV(name, rows) {

function parseDate(s) {
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return s;
  if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/))) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad(m[2]) + '-' + pad(m[1]);
  return null;
}

      <h4>Briefing</h4><ul>${big.length ? `<li>Große Gruppen: ${big.map(r => `${esc(r.name)} (${persons(r)}P, ${r.time})`).join(', ')}</li>` : ''}
        ${unas.length ? `<li><b>${unas.length} Reservierungen noch ohne Tisch</b></li>` : ''}${blocked.length ? `<li>Gesperrte Tische: ${blocked.map(x => esc(x.name)).join(', ')}</li>` : ''}
        <li>Kinderstühle: ${rs.filter(r => r.highchair).length}</li><li>Größter Ankunfts-Slot: ${fromMin(slots.reduce((a, s) => s.c > a.c ? s : a, slots[0]).m)} (${max} Gäste)</li></ul>`;
  }
  if (type === 'allergie') {
    const rs = DB.reservations.filter(r => r.date === D && act(r) && r.allergies).sort((a, b) => a.serviceId.localeCompare(b.serviceId) || resStart(a) - resStart(b));

  }
  if (type === 'hotel') {
    const stays = DB.stays.filter(x => isInHouse(x, D)).sort((a, b) => a.room.localeCompare(b.room, 'de', { numeric: true }));
    const dinner = DB.services.find(s => s.type === 'abend');

      ${stays.map(x => { const r = DB.reservations.find(z => z.stayId === x.id && z.date === D && dinner && z.serviceId === dinner.id);
        return `<tr><td><b>${esc(x.room)}</b></td><td>${x.vip ? '★ ' : ''}${esc(x.name)}${x.arrival === D ? ' <span class="badge hotel">Anreise</span>' : ''}</td><td>${x.adults}${x.children ? '+' + x.children : ''}</td><td>${x.board}</td>
        <td><b>${esc(tblNames(r ? r.tableIds : x.tableIds) || (needsTable(x) ? '— fehlt —' : 'frei'))}</b></td><td>${r ? r.time : ''}</td><td>${fmtShort(x.departure)}</td><td>${esc([x.allergies, x.notes].filter(Boolean).join(' · '))}</td></tr>`; }).join('')}</tbody></table>
      ${stays.length ? '' : '<p class="muted">Keine Hotelgäste im Haus.</p>'}`;
  }
  if (type === 'plan') {
    return head('Tischplan', `${svc.name}, Stand ${fromMin(S.time)}`) + DB.rooms.map(room => `<h4>${esc(room.name)}</h4>${planSVG(room, { mode: 'live', status: tb => tableStatusAt(tb, D, svc.id, S.time) })}`).join('') + legendHTML();
  }
  return '';
}

function bindEditor(main, room) {
  const E = S.edit;

  $('#eRoom').onchange = e => { E.roomId = e.target.value; E.sel = null; render(); };
  $('#eRoomAdd').onclick = () => { const r = { id: uid(), name: 'Neuer Raum', w: 900, h: 600, bg: '' }; DB.rooms.push(r); E.roomId = r.id; E.sel = null; commit('Raum angelegt'); };
  if (room) {
    $('#eRoomName').onchange = e => { room.name = e.target.value || room.name; commit(); };
    $('#eRoomW').onchange = e => { room.w = Math.max(300, +e.target.value); commit(); };
    $('#eRoomH').onchange = e => { room.h = Math.max(200, +e.target.value); commit(); };
    $('#eBg').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 1.5e6) return toast('Bild zu groß (max. 1,5 MB) – bitte verkleinern', 'err');
      const rd = new FileReader(); rd.onload = () => { room.bg = rd.result; commit('Grundriss hochgeladen'); }; rd.readAsDataURL(f);
    };
    if ($('#eBgDel')) $('#eBgDel').onclick = () => { room.bg = ''; commit(); };
    $('#eRoomDel').onclick = () => {
      const used = DB.tables.filter(x => x.roomId === room.id).length;
      confirmModal('Raum löschen?', [`${room.name} mit ${used} Tischen wird gelöscht. Zugewiesene Reservierungen verlieren ihren Tisch.`], () => {
        const ids = DB.tables.filter(x => x.roomId === room.id).map(x => x.id);
        DB.reservations.forEach(r => r.tableIds = (r.tableIds || []).filter(x => !ids.includes(x)));
        DB.stays.forEach(s => s.tableIds = (s.tableIds || []).filter(x => !ids.includes(x)));
        DB.tables = DB.tables.filter(x => x.roomId !== room.id); DB.decor = DB.decor.filter(x => x.roomId !== room.id);
        DB.combos = DB.combos.filter(c => !c.tableIds.some(x => ids.includes(x)));
        DB.rooms.splice(DB.rooms.indexOf(room), 1); E.roomId = null; E.sel = null; commit('Raum gelöscht');
      }, 'Löschen');
    };
  }
  $$('[data-addt]', main).forEach(b => b.onclick = () => {
    if (!room) return;
    const sh = b.dataset.addt, dims = { round: [90, 90, 2, 4], square: [70, 70, 2, 4], rect: [160, 80, 4, 8], bench: [60, 160, 3, 5] }[sh];
    let n = DB.tables.length + 1; while (DB.tables.some(x => x.name === 'T' + n)) n++;
    const tb = { id: uid(), roomId: room.id, name: 'T' + n, shape: sh, x: room.w / 2, y: room.h / 2, w: dims[0], h: dims[1], rot: 0, min: dims[2], max: dims[3], station: '', props: [], blocks: [] };
    DB.tables.push(tb); E.sel = tb.id; commit('Tisch angelegt');
  });
  $$('[data-addd]', main).forEach(b => b.onclick = () => {
    if (!room) return;
    const ty = b.dataset.addd, dims = { wall: [300, 10], door: [80, 14], bar: [200, 50], buffet: [60, 200], column: [26, 26], plant: [40, 40], label: [160, 20] }[ty];
    const d = { id: uid(), roomId: room.id, type: ty, x: room.w / 2, y: room.h / 2, w: dims[0], h: dims[1], rot: 0, text: ty === 'label' ? 'Text' : '' };
    DB.decor.push(d); E.sel = d.id; commit();
  });
  // Layout-Varianten
  $('#lSave').onclick = () => openModal('Layout speichern', '<label>Name der Variante<input id="lName" placeholder="z. B. Bankett, Sommer, Hochzeit"></label>', [{ label: 'Abbrechen' }, { label: 'Speichern', cls: 'primary', action: bg => {
    const pos = {}; DB.tables.filter(x => x.roomId === room.id).forEach(x => pos[x.id] = { x: x.x, y: x.y, rot: x.rot, w: x.w, h: x.h, shape: x.shape, min: x.min, max: x.max });
    DB.layouts.push({ id: uid(), roomId: room.id, name: $('#lName', bg).value || 'Variante', pos }); commit('Layout-Variante gespeichert');
  } }]);
  $$('[data-lload]', main).forEach(b => b.onclick = () => { const l = DB.layouts.find(x => x.id === b.dataset.lload);
    DB.tables.forEach(x => { if (l.pos[x.id]) Object.assign(x, l.pos[x.id]); }); commit('Layout-Variante geladen: ' + l.name); toast('Layout „' + l.name + '“ aktiv'); });
  $$('[data-ldel]', main).forEach(b => b.onclick = () => { DB.layouts = DB.layouts.filter(x => x.id !== b.dataset.ldel); commit(); });

  // Eigenschaften
  const selObj = tblById(E.sel) || DB.decor.find(x => x.id === E.sel);
  $$('[data-p]', main).forEach(el => el.onchange = () => {
    const k = el.dataset.p; let v = el.value;
    if (['min', 'max', 'w', 'h', 'rot'].includes(k)) v = +v || 0;
    if (k === 'roomId' && v !== selObj.roomId) { E.roomId = v; }
    selObj[k] = v; if (selObj.min > selObj.max) selObj.max = selObj.min; commit();
  });
  $$('[data-prop]', main).forEach(el => el.onchange = () => { const p = el.dataset.prop; selObj.props = (selObj.props || []).filter(x => x !== p); if (el.checked) selObj.props.push(p); commit(); });
  if ($('#eDup')) $('#eDup').onclick = () => {
    const c = JSON.parse(JSON.stringify(selObj)); c.id = uid(); c.x += 30; c.y += 30;
    if (c.name) { let n = 2; while (DB.tables.some(x => x.name === selObj.name + '-' + n)) n++; c.name = selObj.name + '-' + n; c.blocks = []; DB.tables.push(c); } else DB.decor.push(c);
    E.sel = c.id; commit();
  };
  if ($('#eDel')) $('#eDel').onclick = () => {
    if (selObj.name !== undefined && DB.tables.includes(selObj)) {
      const refs = DB.reservations.filter(r => (r.tableIds || []).includes(selObj.id) && r.date >= today() && occupies(r)).length;
      const doDel = () => { DB.tables.splice(DB.tables.indexOf(selObj), 1); DB.reservations.forEach(r => r.tableIds = (r.tableIds || []).filter(x => x !== selObj.id));
        DB.stays.forEach(s => s.tableIds = (s.tableIds || []).filter(x => x !== selObj.id)); DB.combos = DB.combos.filter(c => !c.tableIds.includes(selObj.id)); E.sel = null; commit('Tisch gelöscht: ' + selObj.name); };
      if (refs) confirmModal('Tisch löschen?', [`${refs} künftige Reservierung(en) verlieren den Tisch ${selObj.name}.`], doDel, 'Löschen'); else doDel();
    } else { DB.decor.splice(DB.decor.indexOf(selObj), 1); E.sel = null; commit(); }
  };
  // Reviere & Kombinationen
  $$('[data-stc]', main).forEach(el => el.onchange = () => { DB.stations.find(s => s.id === el.dataset.stc).color = el.value; commit(); });
  $$('[data-stn]', main).forEach(el => el.onchange = () => { DB.stations.find(s => s.id === el.dataset.stn).name = el.value; commit(); });
  $$('[data-std]', main).forEach(el => el.onclick = () => { DB.stations = DB.stations.filter(s => s.id !== el.dataset.std); DB.tables.forEach(x => { if (x.station === el.dataset.std) x.station = ''; }); commit(); });
  if ($('#stAdd')) $('#stAdd').onclick = () => { DB.stations.push({ id: uid(), name: 'Revier ' + (DB.stations.length + 1), color: '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0') }); commit(); };
  $$('[data-cd]', main).forEach(el => el.onclick = () => { DB.combos = DB.combos.filter(c => c.id !== el.dataset.cd); commit(); });
  if ($('#cAdd')) $('#cAdd').onclick = () => {
    const names = $('#cNew').value.split(/[+,; ]+/).filter(Boolean), ids = names.map(n => (DB.tables.find(x => x.name.toLowerCase() === n.toLowerCase()) || {}).id);
    if (ids.length < 2 || ids.some(x => !x)) return toast('Mindestens zwei gültige Tischnamen, z. B. T7+T8', 'err');
    DB.combos.push({ id: uid(), name: names.join('+'), tableIds: ids }); commit('Kombination angelegt');
  };

  // Ziehen/Größe im Plan
  const svg = $('svg.plan', main); if (!svg) return;
  svg.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-table-id],[data-decor-id]');
    if (!g) { if (E.sel) { E.sel = null; render(); } return; }
    const id = g.dataset.tableId || g.dataset.decorId, obj = tblById(id) || DB.decor.find(x => x.id === id);
    const resize = e.target.classList.contains('rs-handle');
    const wasSel = E.sel === id; E.sel = id;
    e.preventDefault();
    const p0 = svgPoint(svg, e), o = { x: obj.x, y: obj.y, w: obj.w, h: obj.h }; let moved = false;
    const mv = ev => {
      const p = svgPoint($('svg.plan', main), ev), dx = p.x - p0.x, dy = p.y - p0.y; moved = true;
      if (resize) { obj.w = Math.max(20, snap(o.w + dx * 2, 2)); obj.h = Math.max(10, snap(o.h + dy * 2, 2)); if (obj.shape === 'round' || obj.shape === 'square') obj.h = obj.w; }
      else { obj.x = Math.min(room.w, Math.max(0, snap(o.x + dx, 10))); obj.y = Math.min(room.h, Math.max(0, snap(o.y + dy, 10))); }
      const wrap = $('.plan-wrap', main); wrap.innerHTML = planSVG(room, { mode: 'edit', sel: E.sel, showStations: true });
    };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); if (moved || !wasSel) commit(); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  });
}
